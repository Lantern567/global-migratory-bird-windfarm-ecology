[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bird-wind-ecology"
version = "0.1.0"
description = "Global migratory-bird and wind-farm overlap, direction, and ecological trade-off analysis."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Research team"}
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
geo = ["geopandas>=1", "pyarrow>=17", "shapely>=2"]

[project.scripts]
bird-wind-ecology = "bird_wind_ecology.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

